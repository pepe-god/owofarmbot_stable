title = "owofarmbot_stable gitleaks config"

[extend]
# Inherit the upstream gitleaks default rules (discord tokens, generic API
# keys, private keys, etc.).
useDefault = true

[allowlist]
description = "Repo-local noise that is not a real secret"
paths = [
  # Planning handover docs may quote fake tokens; never flag them.
  '''\.kilo/.*''',
  # This gitleaks config itself.
  '''\.gitleaks\.toml$''',
]
regexes = [
  # Empty-string placeholders in config.json (token / webhookurl).
  '''"token":\s*""''',
  '''"webhookurl":\s*""''',
]
